name: CI

# 本组织的 CI（spec/42 42.2）。上游的 Docker 推送与 dev 预发布任务指向 cedar2025 的镜像与发布，
# 已移除；发布流程在 M3-07、M3-08 按 spec/42 42.5 重新建立。修改登记见 UPSTREAM.md。

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # make ci：SPDX 头检查、依赖许可证扫描、make test（-race）、make build。
  ci:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-linux-${{ matrix.goarch }}
          path: |
            xboard-node-linux-${{ matrix.goarch }}
            xbctl-linux-${{ matrix.goarch }}

  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  # 依赖中已知漏洞需要升级依赖与内核（spec/21 AGT-03），在此之前不阻塞合并。
  govulncheck:
    name: govulncheck (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make vulncheck
